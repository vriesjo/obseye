---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: obseye-deploy-pipeline
  namespace: default
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.29.0"
spec:
  description: >-
    Complete deployment pipeline for containerized applications on on-premise Ubuntu servers.
    
    This pipeline performs the following steps:
    1. Clone source code from Git repository
    2. Build container image using Buildah
    3. Push image to container registry
    4. Deploy application using Helm
    
  params:
    # Git parameters
    - name: git-url
      type: string
      description: Git repository URL
      default: "https://github.com/vriesjo/obseye.git"
    - name: git-revision
      type: string
      description: Git revision to checkout (branch, tag, or commit SHA)
      default: "main"
    - name: git-subdirectory
      type: string
      description: Subdirectory inside workspace to clone into
      default: "source"

    # Build parameters
    - name: image-name
      type: string
      description: Container image name with registry (e.g., quay.io/my-org/obseye)
    - name: image-tag
      type: string
      description: Container image tag
      default: "latest"
    - name: dockerfile
      type: string
      description: Path to Dockerfile relative to context
      default: "./Dockerfile"
    - name: build-context
      type: string
      description: Build context path relative to workspace
      default: "."
    - name: skip-push
      type: string
      description: Skip pushing image to registry (for testing)
      default: "false"

    # Helm deployment parameters
    - name: helm-chart
      type: string
      description: Helm chart path or reference (e.g., ./charts/obseye or myrepo/mychart)
    - name: helm-release-name
      type: string
      description: Name of the Helm release
      default: "obseye"
    - name: helm-release-namespace
      type: string
      description: Kubernetes namespace for deployment
      default: "default"
    - name: helm-values-file
      type: string
      description: Path to Helm values file (relative to workspace)
      default: ""
    - name: helm-set-values
      type: string
      description: Additional Helm values to set (comma-separated key=value)
      default: ""

  workspaces:
    - name: shared-data
      description: Shared workspace for pipeline data (source code, build artifacts)

  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: subdirectory
          value: $(params.git-subdirectory)
        - name: deleteExisting
          value: "true"

    - name: build-image
      taskRef:
        name: buildah
      runAfter:
        - fetch-source
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: IMAGE
          value: "$(params.image-name):$(params.image-tag)"
        - name: DOCKERFILE
          value: $(params.dockerfile)
        - name: CONTEXT
          value: "$(params.git-subdirectory)/$(params.build-context)"
        - name: SKIP_PUSH
          value: $(params.skip-push)

    - name: deploy-helm
      taskRef:
        name: helm-deploy
      runAfter:
        - build-image
      workspaces:
        - name: source
          workspace: shared-data
      params:
        - name: CHART
          value: $(params.helm-chart)
        - name: RELEASE_NAME
          value: $(params.helm-release-name)
        - name: RELEASE_NAMESPACE
          value: $(params.helm-release-namespace)
        - name: VALUES_FILE
          value: $(params.helm-values-file)
        - name: SET_VALUES
          value: $(params.helm-set-values)
        - name: OVERWRITE_VALUES
          value: "image.repository=$(params.image-name),image.tag=$(params.image-tag)"

  results:
    - name: git-commit
      description: The commit SHA that was cloned
      value: $(tasks.fetch-source.results.commit)
    - name: image-digest
      description: Digest of the built image
      value: $(tasks.build-image.results.IMAGE_DIGEST)
    - name: image-url
      description: URL of the built image
      value: $(tasks.build-image.results.IMAGE_URL)
