---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tekton-workspace-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # For single-node clusters, you can use local storage or hostPath
  # storageClassName: local-path  # Uncomment if using local-path provisioner
