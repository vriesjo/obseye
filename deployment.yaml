                "builtIn": 1,
                "datasource": "-- Grafana --",
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "type": "dashboard"
              }
            ]
          },
          "description": "Operations exported by itzitzo-auth-gateway on :8889 and scraped by the Prometheus job itzitzo-auth-gateway. Every operation is included. Rates and percentiles use the dashboard time range; the bar gauges are totals since the process started.",
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "links": [],
          "panels": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "color": { "mode": "thresholds" },
                  "decimals": 2,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [{ "color": "green", "value": null }]
                  },
                  "unit": "ops"
                },
                "overrides": []
              },
              "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
              "id": 1,
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
                "textMode": "auto"
              },
              "pluginVersion": "13.3.2",
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "editorMode": "code",
                  "expr": "sum(rate(gateway_operation_count_total{job=\"itzitzo-auth-gateway\"}[$__rate_interval]))",
                  "legendFormat": "ops",
                  "refId": "A"
                }
              ],
              "title": "Operation rate",
              "type": "stat"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "fieldConfig": {
                "defaults": {
                  "color": { "mode": "thresholds" },
                  "decimals": 3,
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "color": "green", "value": null },
                      { "color": "red", "value": 0.01 }
                    ]
                  },
                  "unit": "ops"
                },
                "overrides": []
              },
              "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
              "id": 2,
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
                "textMode": "auto"
              },
              "pluginVersion": "13.3.2",
              "targets": [
                {
                  "datasource": { "type": "prometheus", "uid": "prometheus" },
                  "editorMode": "code",
                  "expr": "sum(rate(gateway_operation_count_total{job=\"itzitzo-auth-gateway\",error=\"true\"}[$__rate_interval])) or vector(0)",
                  "legendFormat": "errors",
                  "refId": "A"
