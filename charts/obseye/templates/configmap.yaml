apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "obseye.fullname" . }}-config
  labels:
    {{- include "obseye.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'obseye-monitor'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['localhost:9093']

    rule_files:
      - '/etc/prometheus/alerts.yml'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
            labels:
              instance: 'prometheus'

      - job_name: 'alertmanager'
        static_configs:
          - targets: ['localhost:9093']
            labels:
              instance: 'alertmanager'

      - job_name: 'grafana'
        static_configs:
          - targets: ['localhost:3000']
            labels:
              instance: 'grafana'

      - job_name: 'loki'
        static_configs:
          - targets: ['localhost:3100']
            labels:
              instance: 'loki'

  alerts.yml: |
    groups:
      - name: host_alerts
        interval: 30s
        rules:
          - alert: HighCPUUsage
            expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected on {{`{{ $labels.instance }}`}}"
              description: "CPU usage is above 80% (current value: {{`{{ $value }}`}}%)"

          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected on {{`{{ $labels.instance }}`}}"
              description: "Memory usage is above 90% (current value: {{`{{ $value }}`}}%)"

          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs|vfat"}) * 100 < 10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Low disk space on {{`{{ $labels.instance }}`}}"
              description: "Disk space is below 10% (current value: {{`{{ $value }}`}}%)"

      - name: container_alerts
        interval: 30s
        rules:
          - alert: ContainerDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Container {{`{{ $labels.job }}`}} is down"
              description: "Container {{`{{ $labels.job }}`}} on {{`{{ $labels.instance }}`}} has been down for more than 1 minute"

          - alert: ServiceDown
            expr: up{job!~"cadvisor|node-exporter"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service {{`{{ $labels.job }}`}} is down"
              description: "Service {{`{{ $labels.job }}`}} has been unreachable for more than 2 minutes"

  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          continue: true
        - match:
            severity: warning
          receiver: 'warning-receiver'

    receivers:
      - name: 'default-receiver'
        webhook_configs:
          - url: 'http://localhost:9094/alerts/default'
            send_resolved: true

      - name: 'critical-receiver'
        webhook_configs:
          - url: 'http://localhost:9094/alerts/critical'
            send_resolved: true

      - name: 'warning-receiver'
        webhook_configs:
          - url: 'http://localhost:9094/alerts/warning'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'cluster', 'service']

  loki-config.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://localhost:9093

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 744h

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://localhost:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
          httpMethod: POST

      - name: Loki
        type: loki
        access: proxy
        url: http://localhost:3100
        editable: false
        jsonData:
          maxLines: 1000

  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/dashboards
---
# ConfigMap containing actual dashboard JSONs
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "obseye.fullname" . }}-grafana-dashboards
    labels:
    {{- include "obseye.labels" . | nindent 4 }}
data:
{{- $files := .Files.Glob "grafana/provisioning/dashboards/dashboards/*" }}
{{- range $path, $f := $files }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
