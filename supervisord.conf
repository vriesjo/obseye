[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:prometheus]
command=/usr/bin/prometheus --config.file=/app/prometheus/prometheus.yml --storage.tsdb.path=/tmp/prometheus --storage.tsdb.retention.time=15d --web.console.libraries=/etc/prometheus/console_libraries --web.console.templates=/etc/prometheus/consoles --web.enable-lifecycle
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/prometheus.log
stderr_logfile=/var/log/prometheus.err

[program:node-exporter]
command=/usr/bin/node-exporter --path.procfs=/host/proc --path.sysfs=/host/sys --path.rootfs=/rootfs --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/) --web.listen-address=:9100
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/node-exporter.log
stderr_logfile=/var/log/node-exporter.err

[program:cadvisor]
command=/usr/bin/cadvisor --port=8080 --housekeeping_interval=10s --max_housekeeping_interval=15s --event_storage_event_limit=default=0 --event_storage_age_limit=default=0 --disable_metrics=disk,network,tcp,udp,percpu,sched,process --docker_only
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/cadvisor.log
stderr_logfile=/var/log/cadvisor.err

[program:grafana]
command=/usr/sbin/grafana-server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini --packaging=docker cfg:default.paths.logs=/var/log/grafana cfg:default.paths.data=/var/lib/grafana cfg:default.paths.plugins=/var/lib/grafana/plugins cfg:default.paths.provisioning=/app/grafana/provisioning
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/grafana.log
stderr_logfile=/var/log/grafana.err

[program:alertmanager]
command=/usr/bin/alertmanager --config.file=/app/alertmanager/alertmanager.yml --storage.path=/tmp/alertmanager
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/alertmanager.log
stderr_logfile=/var/log/alertmanager.err

[program:loki]
command=/usr/bin/loki -config.file=/app/loki/loki-config.yml
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/loki.log
stderr_logfile=/var/log/loki.err

[program:promtail]
command=/usr/bin/promtail -config.file=/app/promtail/promtail-config.yml
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/promtail.log
stderr_logfile=/var/log/promtail.err
