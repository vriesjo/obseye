[supervisord]
nodaemon=true

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/prometheus.log
stderr_logfile=/var/log/prometheus.err

[program:grafana]
command=/usr/sbin/grafana-server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini --packaging=deb
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/grafana.log
stderr_logfile=/var/log/grafana.err

[program:loki]
command=/usr/local/bin/loki -config.file=/etc/loki/loki-config.yml
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/loki.log
stderr_logfile=/var/log/loki.err

[program:promtail]
command=/usr/local/bin/promtail -config.file=/etc/promtail/promtail-config.yml
priority=40
autostart=true
autorestart=true
stdout_logfile=/var/log/promtail.log
stderr_logfile=/var/log/promtail.err
