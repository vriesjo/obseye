apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obseye.fullname" . }}
  labels:
    {{- include "obseye.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "obseye.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "obseye.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "obseye.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "obseye.fullname" . }}-config
      - name: grafana-dashboards
        configMap:
          name: {{ include "obseye.fullname" . }}-grafana-dashboards
      {{- if .Values.persistence.enabled }}
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: {{ include "obseye.fullname" . }}-prometheus
      - name: grafana-data
        persistentVolumeClaim:
          claimName: {{ include "obseye.fullname" . }}-grafana
      - name: loki-data
        persistentVolumeClaim:
          claimName: {{ include "obseye.fullname" . }}-loki
      - name: alertmanager-data
        persistentVolumeClaim:
          claimName: {{ include "obseye.fullname" . }}-alertmanager
      {{- else }}
      - name: prometheus-data
        emptyDir: {}
      - name: grafana-data
        emptyDir: {}
      - name: loki-data
        emptyDir: {}
      - name: alertmanager-data
        emptyDir: {}
      {{- end }}
      - name: grafana-provisioning
        emptyDir: {}
      initContainers:
      - name: grafana-provisioning-setup
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          set -e
          # create provisioning dirs
          mkdir -p /etc/grafana/provisioning/datasources
          mkdir -p /etc/grafana/provisioning/dashboards/dashboards
          # copy datasources provider (from main config CM)
          cp /config/datasources.yml /etc/grafana/provisioning/datasources/datasources.yml || true
          # copy dashboard provider config if present in main configmap
          cp /config/dashboards.yml /etc/grafana/provisioning/dashboards/dashboards/dashboard.yml || true
          # copy all dashboard JSONs from the dashboard ConfigMap mount
          cp -r /dashboards/* /etc/grafana/provisioning/dashboards/dashboards/ || true
          # ensure Grafana uid (numeric) owns the files so Grafana can read them
          chown -R 472:472 /etc/grafana/provisioning || true
          chmod -R 755 /etc/grafana/provisioning || true
        volumeMounts:
        - name: config
          mountPath: /config
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
        - name: grafana-dashboards
          mountPath: /dashboards
      containers:
      # Prometheus Container
      - name: prometheus
        image: {{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}
        imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time={{ .Values.prometheus.retention }}'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--web.enable-lifecycle'
        ports:
        - name: prometheus
          containerPort: 9090
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: prometheus
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: prometheus
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: config
          mountPath: /etc/prometheus/alerts.yml
          subPath: alerts.yml
        - name: prometheus-data
          mountPath: /prometheus
        resources:
          {{- toYaml .Values.prometheus.resources | nindent 10 }}
      # Grafana Container
      - name: grafana
        image: {{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}
        imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: {{ .Values.grafana.adminUser }}
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.grafana.adminPassword }}
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        ports:
        - name: grafana
          containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/health
            port: grafana
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: grafana
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
        resources:
          {{- toYaml .Values.grafana.resources | nindent 10 }}
      # Loki Container
      - name: loki
        image: {{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}
        imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
        args:
        - '-config.file=/etc/loki/loki-config.yml'
        ports:
        - name: loki
          containerPort: 3100
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /ready
            port: loki
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: loki
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/loki/loki-config.yml
          subPath: loki-config.yml
        - name: loki-data
          mountPath: /loki
        resources:
          {{- toYaml .Values.loki.resources | nindent 10 }}
      # Alertmanager Container
      - name: alertmanager
        image: {{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}
        imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        ports:
        - name: alertmanager
          containerPort: 9093
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: alertmanager
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /-/ready
            port: alertmanager
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager/alertmanager.yml
          subPath: alertmanager.yml
        - name: alertmanager-data
          mountPath: /alertmanager
        resources:
          {{- toYaml .Values.alertmanager.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
