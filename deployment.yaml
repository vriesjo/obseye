---
# PersistentVolumeClaims for data persistence
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obseye-prometheus-data
  labels:
    app: obseye
    component: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obseye-grafana-data
  labels:
    app: obseye
    component: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obseye-loki-data
  labels:
    app: obseye
    component: loki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obseye-alertmanager-data
  labels:
    app: obseye
    component: alertmanager
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: obseye-tempo-data
  labels:
    app: obseye
    component: tempo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# One pod: Prometheus, Grafana, Loki, Tempo, Alertmanager, and the alert webhook.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obseye
  labels:
    app: obseye
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obseye
  template:
    metadata:
      labels:
        app: obseye
    spec:
      securityContext:
        fsGroup: 65534
      volumes:
      - name: config
        configMap:
          name: obseye-config
      - name: grafana-dashboards
        configMap:
          name: obseye-grafana-dashboards
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: obseye-prometheus-data
      - name: grafana-data
        persistentVolumeClaim:
          claimName: obseye-grafana-data
      - name: loki-data
        persistentVolumeClaim:
          claimName: obseye-loki-data
      - name: alertmanager-data
        persistentVolumeClaim:
          claimName: obseye-alertmanager-data
      - name: tempo-data
        persistentVolumeClaim:
          claimName: obseye-tempo-data
      - name: grafana-provisioning
        emptyDir: {}
      initContainers:
      - name: grafana-provisioning-setup
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
            # 1. Create the full directory structure
            mkdir -p /etc/grafana/provisioning/datasources
            mkdir -p /etc/grafana/provisioning/dashboards/dashboards
            mkdir -p /etc/grafana/provisioning/plugins
            mkdir -p /etc/grafana/provisioning/notifiers

            # 2. Copy Datasources
            if [ -f /config/datasources.yml ]; then
              cp /config/datasources.yml /etc/grafana/provisioning/datasources/datasources.yml
            fi

            # 3. Copy Dashboard Provider Config (using -L to follow symlinks)
            if [ -f /config/dashboards.yml ]; then
              cp -L /config/dashboards.yml /etc/grafana/provisioning/dashboards/dashboard.yml
            fi

            # 4. Copy ACTUAL JSON content (The -RL flag is the key here)
            # We copy from the mount point into the sub-folder Grafana is watching
            cp -RL /dashboards/*.json /etc/grafana/provisioning/dashboards/dashboards/ || true

            # 5. Fix Permissions
            chown -R 472:472 /etc/grafana/provisioning
            chmod -R 755 /etc/grafana/provisioning

            echo "Provisioning setup complete. Files in dashboards folder:"
            ls -l /etc/grafana/provisioning/dashboards/dashboards/
        volumeMounts:
        - name: config
          mountPath: /config
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
        - name: grafana-dashboards
          mountPath: /dashboards
      containers:
      # Prometheus Container
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=15d'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--web.enable-lifecycle'
        ports:
        - name: prometheus
          containerPort: 9090
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: config
          mountPath: /etc/prometheus/alerts.yml
          subPath: alerts.yml
        - name: prometheus-data
          mountPath: /prometheus
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      # Grafana Container
      - name: grafana
        image: grafana/grafana:latest
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
          value: /etc/grafana/provisioning/dashboards/dashboards/itzitzo-auth-gateway.json
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        # Grafana 13 starts one process per bundled datasource. This pod only queries Prometheus, Loki, and Tempo.
        - name: GF_PLUGINS_DISABLE_PLUGINS
          value: cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,stackdriver,zipkin
        # Stay under the cgroup limit so the Go runtime GCs before the kernel OOM-kills the process.
        - name: GOMEMLIMIT
          value: 512MiB
        ports:
        - name: grafana
          containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
        resources:
          limits:
            cpu: 200m
            memory: 768Mi
          requests:
            cpu: 50m
            memory: 256Mi
      # Loki Container
      - name: loki
        image: grafana/loki:latest
        args:
        - '-config.file=/etc/loki/loki-config.yml'
        ports:
        - name: loki
          containerPort: 3100
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/loki/loki-config.yml
          subPath: loki-config.yml
        - name: loki-data
          mountPath: /loki
        resources:
          limits:
            cpu: 300m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
      # Alertmanager Container
      - name: alertmanager
        image: prom/alertmanager:latest
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        # Default cluster port is 9094, which is the alert webhook in this pod.
        - '--cluster.listen-address='
        ports:
        - name: alertmanager
          containerPort: 9093
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager/alertmanager.yml
          subPath: alertmanager.yml
        - name: alertmanager-data
          mountPath: /alertmanager
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      - name: tempo
        image: grafana/tempo:latest
        args:
        - '-target=all'
        - '-config.file=/etc/tempo.yaml'
        ports:
        - name: tempo
          containerPort: 3200
          protocol: TCP
        - name: tempo-otlp
          containerPort: 4318
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: 3200
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/tempo.yaml
          subPath: tempo.yaml
        - name: tempo-data
          mountPath: /var/tempo
        resources:
          limits:
            cpu: 300m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
      - name: alertreceiver
        image: ghcr.io/mendhak/http-https-echo:latest
        env:
        - name: HTTP_PORT
          value: "9094"
        - name: LOG_WITHOUT_NEWLINE
          value: "true"
        - name: LOG_IGNORE_PATH
          value: /health
        ports:
        - name: alertreceiver
          containerPort: 9094
          protocol: TCP

---
# Service to expose all containers
apiVersion: v1
kind: Service
metadata:
  name: obseye
  labels:
    app: obseye
spec:
  type: ClusterIP
  ports:
  - name: prometheus
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: grafana
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: loki
    port: 3100
    targetPort: 3100
    protocol: TCP
  - name: alertmanager
    port: 9093
    targetPort: 9093
    protocol: TCP
  - name: tempo
    port: 3200
    targetPort: 3200
    protocol: TCP
  - name: tempo-otlp
    port: 4318
    targetPort: 4318
    protocol: TCP
  - name: alertreceiver
    port: 9094
    targetPort: 9094
    protocol: TCP
  selector:
    app: obseye
