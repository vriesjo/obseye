---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
  namespace: default
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.29.0"
    tekton.dev/categories: Git
    tekton.dev/tags: git
    tekton.dev/displayName: "git clone"
    tekton.dev/platforms: "linux/amd64,linux/s390x,linux/ppc64le,linux/arm64"
spec:
  description: >-
    This Task clones a Git repository into a workspace.
    
    It uses git clone to fetch the repository from the provided URL
    and checkout the specified revision (branch, tag, or commit SHA).
    
  params:
    - name: url
      description: Git repository URL to clone
      type: string
    - name: revision
      description: Git revision to checkout (branch, tag, commit SHA)
      type: string
      default: "main"
    - name: refspec
      description: Git refspec to fetch before checking out revision
      type: string
      default: ""
    - name: submodules
      description: Initialize and fetch git submodules
      type: string
      default: "true"
    - name: depth
      description: Perform a shallow clone with specified depth
      type: string
      default: "1"
    - name: sslVerify
      description: Verify SSL certificates when cloning
      type: string
      default: "true"
    - name: subdirectory
      description: Subdirectory inside workspace to clone the repo into
      type: string
      default: "source"
    - name: deleteExisting
      description: Clean out the contents of the destination directory if it exists
      type: string
      default: "true"
    - name: httpProxy
      description: HTTP proxy server
      type: string
      default: ""
    - name: httpsProxy
      description: HTTPS proxy server
      type: string
      default: ""
    - name: noProxy
      description: No proxy domains
      type: string
      default: ""
    - name: verbose
      description: Log the commands used
      type: string
      default: "true"
    - name: gitInitImage
      description: The image providing the git-init binary
      type: string
      default: "gcr.io/tekton-releases/github.com/tektoncd/pipeline/cmd/git-init:v0.40.2"
    - name: userHome
      description: Absolute path to the user's home directory
      type: string
      default: "/home/git"

  results:
    - name: commit
      description: The precise commit SHA after clone
    - name: url
      description: The URL that was cloned
    - name: committer-date
      description: The epoch timestamp of the commit

  workspaces:
    - name: output
      description: The workspace where the git repo will be cloned

  steps:
    - name: clone
      image: "$(params.gitInitImage)"
      env:
        - name: HOME
          value: "$(params.userHome)"
        - name: PARAM_URL
          value: $(params.url)
        - name: PARAM_REVISION
          value: $(params.revision)
        - name: PARAM_REFSPEC
          value: $(params.refspec)
        - name: PARAM_SUBMODULES
          value: $(params.submodules)
        - name: PARAM_DEPTH
          value: $(params.depth)
        - name: PARAM_SSL_VERIFY
          value: $(params.sslVerify)
        - name: PARAM_SUBDIRECTORY
          value: $(params.subdirectory)
        - name: PARAM_DELETE_EXISTING
          value: $(params.deleteExisting)
        - name: PARAM_HTTP_PROXY
          value: $(params.httpProxy)
        - name: PARAM_HTTPS_PROXY
          value: $(params.httpsProxy)
        - name: PARAM_NO_PROXY
          value: $(params.noProxy)
        - name: PARAM_VERBOSE
          value: $(params.verbose)
        - name: PARAM_USER_HOME
          value: $(params.userHome)
        - name: WORKSPACE_OUTPUT_PATH
          value: $(workspaces.output.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      script: |
        #!/usr/bin/env sh
        set -eu

        if [ "${PARAM_VERBOSE}" = "true" ] ; then
          set -x
        fi

        if [ "${PARAM_DELETE_EXISTING}" = "true" ] ; then
          if [ -d "${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}" ] ; then
            echo "Cleaning existing directory ${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"
            rm -rf "${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"
          fi
        fi

        test -z "${PARAM_HTTP_PROXY}" || export HTTP_PROXY="${PARAM_HTTP_PROXY}"
        test -z "${PARAM_HTTPS_PROXY}" || export HTTPS_PROXY="${PARAM_HTTPS_PROXY}"
        test -z "${PARAM_NO_PROXY}" || export NO_PROXY="${PARAM_NO_PROXY}"

        CHECKOUT_DIR="${WORKSPACE_OUTPUT_PATH}/${PARAM_SUBDIRECTORY}"
        mkdir -p "${CHECKOUT_DIR}"

        git config --global --add safe.directory "${CHECKOUT_DIR}"

        # Setting up git credentials if needed
        if [ "${PARAM_SSL_VERIFY}" != "true" ]; then
          git config --global http.sslVerify false
        fi

        cd "${CHECKOUT_DIR}"

        # Clone the repository
        CLONE_OPTS=""
        if [ -n "${PARAM_DEPTH}" ] && [ "${PARAM_DEPTH}" != "0" ]; then
          CLONE_OPTS="${CLONE_OPTS} --depth=${PARAM_DEPTH}"
        fi
        
        if [ -n "${PARAM_REFSPEC}" ]; then
          git init
          git remote add origin "${PARAM_URL}"
          git fetch ${CLONE_OPTS} origin "${PARAM_REFSPEC}"
          git checkout FETCH_HEAD
        else
          git clone ${CLONE_OPTS} --no-checkout "${PARAM_URL}" .
          git checkout "${PARAM_REVISION}"
        fi

        # Fetch submodules if requested
        if [ "${PARAM_SUBMODULES}" = "true" ] ; then
          git submodule init
          git submodule update --recursive
        fi

        RESULT_SHA="$(git rev-parse HEAD)"
        EXIT_CODE="$?"
        if [ "${EXIT_CODE}" != 0 ] ; then
          exit "${EXIT_CODE}"
        fi

        RESULT_COMMITTER_DATE="$(git log -1 --pretty=%ct)"

        # Store results
        printf "%s" "${RESULT_SHA}" > "$(results.commit.path)"
        printf "%s" "${PARAM_URL}" > "$(results.url.path)"
        printf "%s" "${RESULT_COMMITTER_DATE}" > "$(results.committer-date.path)"

        echo "Successfully cloned ${PARAM_URL} @ ${RESULT_SHA}"
