---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah
  namespace: default
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.29.0"
    tekton.dev/categories: Image Build
    tekton.dev/tags: buildah, image-build
    tekton.dev/displayName: "buildah"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    This Task builds a container image using Buildah, a tool that facilitates 
    building OCI container images.
    
    Buildah supports building images from a Dockerfile and pushing them to a 
    container registry. This task is suitable for on-premise Ubuntu servers.
    
  params:
    - name: IMAGE
      description: Reference of the image buildah will produce (e.g., quay.io/my-org/my-app:latest)
      type: string
    - name: BUILDER_IMAGE
      description: The location of the buildah builder image
      type: string
      default: quay.io/buildah/stable:v1.31.0
    - name: DOCKERFILE
      description: Path to the Dockerfile to build (relative to context)
      type: string
      default: ./Dockerfile
    - name: CONTEXT
      description: Path to the build context (relative to workspace)
      type: string
      default: .
    - name: TLSVERIFY
      description: Verify the TLS on the registry endpoint
      type: string
      default: "true"
    - name: FORMAT
      description: The format of the built container (oci or docker)
      type: string
      default: "oci"
    - name: BUILD_EXTRA_ARGS
      description: Extra parameters passed for the build command
      type: string
      default: ""
    - name: PUSH_EXTRA_ARGS
      description: Extra parameters passed for the push command
      type: string
      default: ""
    - name: SKIP_PUSH
      description: Skip pushing the image to registry
      type: string
      default: "false"

  results:
    - name: IMAGE_DIGEST
      description: Digest of the image just built
    - name: IMAGE_URL
      description: URL of the image just built

  workspaces:
    - name: source
      description: Workspace containing the source code and Dockerfile
    - name: dockerconfig
      description: An optional workspace with Docker config.json for authentication
      optional: true

  steps:
    - name: build
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.CONTEXT)
      securityContext:
        privileged: true
        runAsUser: 0
      script: |
        #!/bin/bash
        set -e

        echo "Building image: $(params.IMAGE)"
        echo "Dockerfile: $(params.DOCKERFILE)"
        echo "Context: $(workspaces.source.path)/$(params.CONTEXT)"

        # Build the image
        buildah --storage-driver=vfs bud \
          $(params.BUILD_EXTRA_ARGS) \
          --format=$(params.FORMAT) \
          --tls-verify=$(params.TLSVERIFY) \
          --no-cache \
          -f $(params.DOCKERFILE) \
          -t $(params.IMAGE) \
          .

        echo "Image built successfully"

    - name: push
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.CONTEXT)
      securityContext:
        privileged: true
        runAsUser: 0
      script: |
        #!/bin/bash
        set -e

        if [ "$(params.SKIP_PUSH)" = "true" ]; then
          echo "Skipping push as SKIP_PUSH is set to true"
          exit 0
        fi

        # Configure authentication if dockerconfig workspace is provided
        if [ -d "$(workspaces.dockerconfig.path)" ] 2>/dev/null && [ -f "$(workspaces.dockerconfig.path)/config.json" ]; then
          export REGISTRY_AUTH_FILE="$(workspaces.dockerconfig.path)/config.json"
          echo "Using authentication from dockerconfig workspace"
        else
          echo "No dockerconfig workspace provided, using default authentication"
        fi

        echo "Pushing image: $(params.IMAGE)"

        # Push the image
        buildah --storage-driver=vfs push \
          $(params.PUSH_EXTRA_ARGS) \
          --tls-verify=$(params.TLSVERIFY) \
          $(params.IMAGE) \
          docker://$(params.IMAGE)

        echo "Image pushed successfully"

    - name: digest
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.CONTEXT)
      securityContext:
        privileged: true
        runAsUser: 0
      script: |
        #!/bin/bash
        set -e

        # Get image digest
        buildah --storage-driver=vfs images --format '{{ .Digest }}' --filter reference=$(params.IMAGE) | \
          tee "$(results.IMAGE_DIGEST.path)"

        # Store image URL
        echo -n "$(params.IMAGE)" | tee "$(results.IMAGE_URL.path)"

        echo ""
        echo "Image digest saved to results"
