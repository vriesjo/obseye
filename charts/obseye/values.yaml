# Default values for obseye
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Legacy image config - no longer used with sidecar pattern
image:
  repository: localhost:5000/obseye
  pullPolicy: IfNotPresent
  tag: "latest"

# Prometheus configuration
prometheus:
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  retention: 15d
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Grafana configuration
grafana:
  image:
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: admin
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Loki configuration
loki:
  image:
    repository: grafana/loki
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Alertmanager configuration
alertmanager:
  image:
    repository: prom/alertmanager
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65534

securityContext: {}

service:
  type: ClusterIP
  prometheus:
    port: 9090
  grafana:
    port: 3000
  loki:
    port: 3100
  alertmanager:
    port: 9093

# Persistence configuration for data volumes
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClass: ""
  prometheus:
    size: 8Gi
  grafana:
    size: 2Gi
  loki:
    size: 10Gi
  alertmanager:
    size: 2Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: obseye.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
