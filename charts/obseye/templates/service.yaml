apiVersion: v1
kind: Service
metadata:
  name: {{ include "obseye.fullname" . }}
  labels:
    {{- include "obseye.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.prometheus.port }}
      targetPort: prometheus
      protocol: TCP
      name: prometheus
    - port: {{ .Values.service.grafana.port }}
      targetPort: grafana
      protocol: TCP
      name: grafana
    - port: {{ .Values.service.loki.port }}
      targetPort: loki
      protocol: TCP
      name: loki
    - port: {{ .Values.service.alertmanager.port }}
      targetPort: alertmanager
      protocol: TCP
      name: alertmanager
  selector:
    {{- include "obseye.selectorLabels" . | nindent 4 }}
